name: Build TAQI Browser Python EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview pyinstaller

    - name: Build Standalone EXE with Icon
      run: |
        pyinstaller --noconsole --onefile --icon=icon.ico --add-data "home.html;." main.py

    - name: Upload TAQI Browser EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaqiBrowser-Python-EXE
        path: dist/main.exe
